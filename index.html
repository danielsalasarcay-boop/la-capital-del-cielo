<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>La Capital del Cielo — Casas privadas de lujo en Los Roques</title>
  <meta name="description" content="Alquiler de casas privadas de lujo en Los Roques, Venezuela. Casa completa por noche con staff, chef privado y limpieza incluidos.">
  <meta name="theme-color" content="#FFFFFF">

  <!-- Open Graph -->
  <link rel="canonical" href="https://danielsalasarcay-boop.github.io/la-capital-del-cielo/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="La Capital del Cielo">
  <meta property="og:locale" content="es_VE">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:title" content="La Capital del Cielo — Casas privadas de lujo en Los Roques">
  <meta property="og:description" content="Casa completa por noche con staff, chef privado y limpieza incluidos.">
  <meta property="og:url" content="https://danielsalasarcay-boop.github.io/la-capital-del-cielo/">
  <meta property="og:image" content="https://danielsalasarcay-boop.github.io/la-capital-del-cielo/img/general/logo.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="img/general/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/general/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/general/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <!-- Pantalla de carga: solo la primera página de la visita -->
  <script>
    (function () {
      var d = document.documentElement, seen = false;
      try { seen = sessionStorage.getItem('lcdc-intro') === '1'; } catch (e) {}
      d.classList.add(seen ? 'loader-skip' : 'is-loading');
    })();
  </script>
  <noscript><style>#loader { display: none; }</style></noscript>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Tenor+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=20260930k">
  <link rel="stylesheet" href="css/layout.css?v=20260930k">
  <link rel="stylesheet" href="css/components.css?v=20260930k">
</head>
<body>
  <!-- Pantalla de carga con el logo (la controla js/main.js) -->
  <div id="loader" aria-hidden="true">
    <div class="loader-inner">
      <img class="loader-logo" src="img/general/logo.png" alt="" width="956" height="462" decoding="async" fetchpriority="high">
      <span class="loader-line"></span>
    </div>
  </div>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <!-- 1. Header fijo (lo genera js/main.js) -->
  <header id="site-header"></header>

  <main id="contenido">

    <!-- 2. Hero a pantalla completa -->
    <section class="hero hero--photo" id="inicio">
      <div class="bg-media" aria-hidden="true">
        <img src="img/general/arrecife-1600.jpg"
             srcset="img/general/arrecife-900.jpg 900w, img/general/arrecife-1600.jpg 1600w"
             sizes="100vw" alt="" width="1600" height="1200" fetchpriority="high" decoding="async">
      </div>
      <div class="container hero-content hero-brand">
        <h1 class="hero-logo">
          <img src="img/general/logo-white.png" alt="La Capital del Cielo" width="956" height="462" fetchpriority="high">
        </h1>
        <span class="hero-divider" aria-hidden="true"></span>
        <p class="hero-tagline" data-i18n="home.hero_tagline"></p>
        <p class="kicker" data-i18n="home.hero_kicker"></p>
        <p><a class="btn btn-light" href="#casas" data-i18n="home.hero_cta"></a></p>
      </div>
    </section>

    <!-- 4. Nuestras casas (generado desde data/casas.json) -->
    <section class="section section--alt" id="casas">
      <div class="container">
        <div class="section-head">
          <p class="kicker" data-i18n="home.casas_kicker"></p>
          <h2 class="h2" data-i18n="home.casas_title"></h2>
        </div>
        <div class="grid grid-cards" id="casas-grid" aria-live="polite"></div>
        <p class="text-center" style="margin-top: var(--space-5)">
          <a class="btn btn-outline" href="casas.html" data-i18n="common.ver_todas"></a>
        </p>
      </div>
    </section>

    <!-- 5. La experiencia -->
    <section class="section section--gray" id="experiencia">
      <div class="container">
        <div class="section-head">
          <p class="kicker" data-i18n="home.exp_kicker"></p>
          <h2 class="h2" data-i18n="home.exp_title"></h2>
        </div>
        <div class="grid grid-features">
          <article class="feature" data-reveal>
            <div class="ph ph-square" role="img" aria-label="Staff"><span>Imagen</span></div>
            <h3 class="h3" data-i18n="exp.staff_t"></h3>
            <p data-i18n="exp.staff_d"></p>
          </article>
          <article class="feature" data-reveal>
            <div class="media ph-square feature-photo"><img src="img/general/gastronomia-700.jpg" srcset="img/general/gastronomia-700.jpg 700w, img/general/gastronomia.jpg 1400w" sizes="(min-width: 960px) 25vw, (min-width: 600px) 50vw, 100vw" alt="Brochetas con puré a la luz de las velas" loading="lazy" decoding="async" style="object-position: 55% 72%"></div>
            <h3 class="h3" data-i18n="exp.chef_t"></h3>
            <p data-i18n="exp.chef_d"></p>
          </article>
          <article class="feature" data-reveal>
            <div class="media ph-square feature-photo"><img src="img/general/limpieza-700.jpg" srcset="img/general/limpieza-700.jpg 700w, img/general/limpieza.jpg 1400w" sizes="(min-width: 960px) 25vw, (min-width: 600px) 50vw, 100vw" alt="Mesa impecable con vajilla azul frente al mar turquesa" loading="lazy" decoding="async" style="object-position: 40% 62%"></div>
            <h3 class="h3" data-i18n="exp.limpieza_t"></h3>
            <p data-i18n="exp.limpieza_d"></p>
          </article>
          <article class="feature" data-reveal>
            <div class="media ph-square feature-photo"><img src="img/general/bote-700.jpg" srcset="img/general/bote-700.jpg 700w, img/general/bote.jpg 1400w" sizes="(min-width: 960px) 25vw, (min-width: 600px) 50vw, 100vw" alt="Bote privado con motores Yamaha en aguas turquesa al atardecer" loading="lazy" decoding="async"></div>
            <h3 class="h3" data-i18n="exp.bote_t"></h3>
            <p data-i18n="exp.bote_d"></p>
          </article>
        </div>
      </div>
    </section>

    <!-- Merchandise (generado desde data/merch.json) -->
    <section class="section section--brand" id="merchandise">
      <div class="container">
        <div class="section-head">
          <p class="kicker" data-i18n="merch.kicker"></p>
          <h2 class="h2" data-i18n="merch.title"></h2>
          <p data-i18n="merch.sub"></p>
        </div>
        <div class="grid merch-grid merch-grid--home" id="merch-grid" data-limit="2" aria-live="polite"></div>
        <p class="text-center" style="margin-top: var(--space-5)">
          <a class="btn btn-primary" href="merchandise.html" data-i18n="merch.ver_todo"></a>
        </p>
      </div>
    </section>

    <!-- 7. CTA final de reserva -->
    <section class="section photo-section photo-section--cta" id="reservar">
      <div class="bg-media" aria-hidden="true">
        <img src="img/general/banco-arena-1600.jpg"
             srcset="img/general/banco-arena-900.jpg 900w, img/general/banco-arena-1600.jpg 1600w"
             sizes="100vw" alt="" width="1600" height="1200" loading="lazy" decoding="async">
      </div>
      <div class="container narrow text-center stack stack--center" data-reveal>
        <h2 class="h2" data-i18n="home.cta_title"></h2>
        <div class="cta-body">
          <p data-i18n="home.cta_text"></p>
          <div class="channels" data-channels></div>
        </div>
      </div>
    </section>

  </main>

  <!-- 8. Footer (lo genera js/main.js) -->
  <footer id="site-footer"></footer>

  <script src="js/i18n.js?v=20260930k"></script>
  <script src="js/main.js?v=20260930k"></script>
  <script src="js/casas.js?v=20260930k"></script>
  <script src="js/merch.js?v=20260930k"></script>
</body>
</html>
